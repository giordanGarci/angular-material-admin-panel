<div fxLayout="row" fxLayoutAlign="center">
  <div  fxLayout="column" fxFlex="1000px">
    <form class="mt-60" #clientesFrm="ngForm" (ngSubmit)="getClients()">
      <mat-card class="mt-60" appearance="outlined">
        <mat-card-header>
          <mat-card-title>Consultar Clientes</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-20">
          <div fxLayout="row">
            <div fxLayout="column" fxFlex="900px">
              <mat-form-field class="full-width">
                <mat-label>Nome</mat-label>
                <input type="text"
                      placeholder="Digite seu nome"
                      matInput
                      [(ngModel)]="nameToSearch"
                      name="nameToSearch"/>
              </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions fxLayoutGap="12px">
            <button mat-flat-button color="primary" type="submit">
              <mat-icon fontIcon="search"></mat-icon>
              Consultar
            </button>
        </mat-card-actions>

      </mat-card>
    </form>
  </div>
</div>

<div fxLayout="row" fxLayoutAlign="center" class="mt-20">
  <div  fxLayout="column" fxFlex="1000px">
      <mat-card class="mt-60" appearance="outlined">
        <mat-card-header>
          <mat-card-title>Resultado</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-20">
          <table mat-table [dataSource]="clients" class="mat-elevation-z8">

            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> ID </th>
              <td mat-cell *matCellDef="let client"> {{client.id}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Nome </th>
              <td mat-cell *matCellDef="let client"> {{client.name}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Email </th>
              <td mat-cell *matCellDef="let client"> {{client.email}} </td>
            </ng-container>

            <ng-container matColumnDef="cpf">
              <th mat-header-cell *matHeaderCellDef> CPF </th>
              <td mat-cell *matCellDef="let client"> {{client.cpf}} </td>
            </ng-container>

            <ng-container matColumnDef="birthDate">
              <th mat-header-cell *matHeaderCellDef> Data de Nascimento </th>
              <td mat-cell *matCellDef="let client"> {{client.birthDate}} </td>
            </ng-container>

            <ng-container matColumnDef="uf">
              <th mat-header-cell *matHeaderCellDef> UF </th>
              <td mat-cell *matCellDef="let client"> {{client.uf}} </td>
            </ng-container>

            <ng-container matColumnDef="municipio">
              <th mat-header-cell *matHeaderCellDef> Município </th>
              <td mat-cell *matCellDef="let client"> {{client.municipio}} </td>
            </ng-container>

            <!-- exclude and edit -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let client">
                <button type="button" mat-button (click)="prepareEdit(client.id)">
                  <mat-icon fontIcon="edit"></mat-icon>
                  Editar
                </button>
                  <br>
                @if(!client.isDeleting){
                  <button type="button" mat-button (click)="prepareDelete(client)">
                    <mat-icon fontIcon="delete"></mat-icon>
                    Deletar
                  </button>
                }@else{
                  <button type="button" mat-button (click)="deleteClient(client.id)">
                    <mat-icon fontIcon="question_mark"></mat-icon>
                    Confirmar deleção?
                  </button>
                }
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          </table>
        </mat-card-content>
      </mat-card>
    </div>
</div>
