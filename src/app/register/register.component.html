<div fxLayout="row" fxLayoutAlign="center">
  <div  fxLayout="column" fxFlex="900px">
    <form class="mt-60" #clientesFrm="ngForm" (ngSubmit)="addClient()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados pessoais</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-20">
          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="800px">
              <mat-form-field class="full-width">
                <mat-label>Nome: *</mat-label>
                <input type="text"
                      placeholder="Ex.: José da Silva"
                      matInput
                      name="name"
                      required
                      [(ngModel)]="client.name"/>
              </mat-form-field>
            </div>
          </div>
          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="800px">
              <mat-form-field class="full-width">
                <mat-label>Email: *</mat-label>
                <input type="email"
                      placeholder="Digite seu email"
                      matInput
                      name="email"
                      [(ngModel)]="client.email"/>
              </mat-form-field>
            </div>
          </div>
          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>CPF: *</mat-label>
                <input type="text"
                      placeholder="Digite seu CPF"
                      matInput
                      name="cpf"
                      [(ngModel)]="client.cpf"/>
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>Data de Nascimento: *</mat-label>
                <input type="text"
                      matInput
                      placeholder="DD/MM/AAAA"
                      name="birthDate"
                      [(ngModel)]="client.birthDate"/>
              </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions fxLayoutGap="12px">
            <button mat-flat-button color="primary" type="submit" [disabled]="!clientesFrm.form.valid">
              <mat-icon fontIcon="save"></mat-icon>
              Salvar
            </button>

            <button mat-flat-button color="primary">
              <mat-icon fontIcon="refresh"></mat-icon>
              Atualizar
            </button>

            <button mat-flat-button color="accent">
              <mat-icon fontIcon="backspace"></mat-icon>
              Limpar
            </button>

        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
